name: Coronal Hole HSS historical backfill
on:
  workflow_dispatch:
    inputs:
      start:
        description: First observation date, YYYY-MM-DD
        required: true
        default: '2026-09-01'
      end:
        description: End date exclusive, YYYY-MM-DD; at most 93 days
        required: true
        default: '2026-09-08'
permissions:
  contents: write
concurrency:
  group: chhss-backfill-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: worker
      - uses: actions/checkout@v6
        with:
          ref: main
          path: publication
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements-chhss.txt
      - name: Validate date range
        run: |
          python - <<'PY'
          import os,datetime,re
          a,b=os.environ['START'],os.environ['END']
          assert re.fullmatch(r'\d{4}-\d{2}-\d{2}',a) and re.fullmatch(r'\d{4}-\d{2}-\d{2}',b), 'Use ISO dates'
          a,b=map(datetime.date.fromisoformat,[a,b])
          assert datetime.date(2010,5,1)<=a<b<=datetime.datetime.now(datetime.timezone.utc).date(), 'Invalid archive range'
          assert 1<=(b-a).days<=93, 'Split requests into no more than 93 days per run'
          PY
      - name: Install maintained processing runtime
        run: python -m pip install -r worker/requirements-chhss.txt
      - name: Test science and publication contracts
        working-directory: worker
        run: python -m unittest discover -s tests -v
      - uses: actions/cache@v4
        with:
          path: .chhss-cache
          key: chhss-fits-${{ inputs.start }}-${{ inputs.end }}-${{ github.run_id }}
          restore-keys: chhss-fits-${{ inputs.start }}-${{ inputs.end }}-
      - name: Backfill numerical observations and score matched truth
        id: process
        env:
          PYTHONPATH: worker
        run: python -u -m chhss.pipeline backfill --start "$START" --end "$END" --output results
      - name: Preserve provenance
        if: always()
        run: |
          mkdir -p results/source
          cp worker/chhss/*.py results/source/
          cp worker/requirements-chhss.txt results/source/
          git -C worker rev-parse HEAD > results/source-commit.txt
          python -m pip freeze > results/environment.txt
          if [ -d .chhss-cache ]; then
            find .chhss-cache -name '*.source.json' -print0 | tar --null -T - -czf results/acquisition-manifests.tar.gz
          fi
      - name: Archive complete run evidence before publishing compact records
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="chhss-${START}-${END}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          asset="chhss-${START}-${END}.zip"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${asset}"
          python worker/scripts/archive_backfill.py --source results --output "dist/$asset" --url "$url"
          gh release create "$tag" "dist/$asset" results/archive.json \
            --target "$GITHUB_SHA" --title "CH/HSS observations ${START} to ${END} (exclusive)" \
            --notes 'Full run evidence, including acquired rasters, truth, source, environment and failed dates. Coverage is stated in archive.json; acquisition does not establish forecast skill.' --latest=false
          gh release download "$tag" --pattern "$asset" --dir verified
          cmp "dist/$asset" "verified/$asset"
      - name: Persist compact cases and scores
        if: success() && github.ref == 'refs/heads/main'
        env:
          PYTHONPATH: ${{ github.workspace }}/worker
        run: |
          set -euo pipefail
          cd publication
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            dest="chhss-data/backfill/${START}_${END}"
            mkdir -p "$dest"
            cp ../results/cases.json ../results/validation.json ../results/backfill-progress.json ../results/omni-manifest.json ../results/source-commit.txt ../results/archive.json "$dest/"
            python -m chhss.publish --root chhss-data
            git add chhss-data
            if git diff --cached --quiet; then break; fi
            git commit -m "Record CH/HSS backfill $START to $END"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chhss-backfill-${{ inputs.start }}-${{ inputs.end }}
          path: results/
          retention-days: 90
      - name: Check acquisition acceptance
        run: |
          python - <<'PY'
          import json,datetime
          from pathlib import Path
          progress=json.loads(Path('results/backfill-progress.json').read_text())
          a,b=(datetime.datetime.fromisoformat(progress[k].replace('Z','+00:00')) for k in ['start','endExclusive'])
          assert progress['attempted']==(b-a).days, 'Requested dates were not all attempted'
          assert progress['succeeded']>0, 'No real observations acquired; inspect archived failures'
          assert progress['failed']==0, 'Some requested dates failed; coverage remains incomplete'
          PY
