name: CH HSS FITS diagnostics
on:
  push:
    branches: [chhss-ingestion-20260918]
    paths: ['.github/workflows/chhss-fast-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests astropy
      - name: Inspect NRT FITS headers and official flag documentation
        run: |
          mkdir probe
          python - <<'PY'
          import requests,json,re,io
          from datetime import datetime,timezone,timedelta
          from astropy.io import fits
          from pathlib import Path
          now=datetime.now(timezone.utc);out={}
          for delta in [0,-1]:
            t=now+timedelta(hours=delta);base=f'https://jsoc1.stanford.edu/data/aia/synoptic/nrt/{t:%Y/%m/%d}/H{t:%H}00/'
            try:
              r=requests.get(base,timeout=25);r.raise_for_status();names=sorted(set(re.findall(r'AIA\d{8}_\d{4,6}_0193\.fits',r.text)),reverse=True)
              for name in names[:3]:
                r=requests.get(base+name,timeout=25);r.raise_for_status()
                with fits.open(io.BytesIO(r.content)) as h:
                  x=next(z for z in h if z.data is not None)
                  out[name]={'header':dict(x.header),'comments':dict(zip(x.header.keys(),x.header.comments))}
                Path('probe/'+name).write_bytes(r.content)
            except Exception as e:out[base]={'error':str(e)}
          for name,url in [('level1','http://jsoc.stanford.edu/jsocwiki/Lev1Doc'),('aialevel1','http://jsoc.stanford.edu/jsocwiki/AiaLev1'),('header','http://jsoc.stanford.edu/cvs/JSOC/proj/lev0/apps/imgdecode.h?view=co')]:
            try:
              r=requests.get(url,timeout=20);r.raise_for_status();Path('probe/'+name+'.html').write_text(r.text)
            except Exception as e:out[name]={'error':str(e)}
          Path('probe/quality.json').write_text(json.dumps(out,indent=2,default=str));print(json.dumps(out,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fits-diagnostic
          path: probe/
