name: CH HSS FITS diagnostics
on:
  push:
    branches: [chhss-ingestion-20260918]
    paths: ['.github/workflows/chhss-fast-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'sunpy[map,net]>=6,<8' 'requests>=2.32,<3' 'reproject>=0.14,<1' 'scikit-image>=0.25,<1'
      - name: Bounded full FITS processing profile
        run: |
          mkdir probe
          timeout 180 python -u - <<'PY' > probe/profile.log 2>&1 || true
          import sys,faulthandler,time,traceback
          sys.path.insert(0,'chhss')
          faulthandler.dump_traceback_later(25,repeat=True)
          import pipeline
          old=pipeline.Acquire.download
          def dl(self,*args,**kwargs):
              print('FETCH START',args[:2],flush=True);t=time.monotonic()
              v=old(self,*args,**kwargs)
              print('FETCH DONE',time.monotonic()-t,args[:2],flush=True);return v
          pipeline.Acquire.download=dl
          print('BEGIN',flush=True)
          try:
              p=pipeline.make_pack(pipeline.Acquire('.chhss-cache'),'2024-01-01T12:00:00Z');pipeline.dump('probe/measurement.json',p);print('COMPLETE',flush=True)
          except Exception:traceback.print_exc()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fits-diagnostic
          path: probe/
