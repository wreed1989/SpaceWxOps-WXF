name: Coronal Hole HSS Outlook data
on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/chhss-live.yml', 'chhss/**', 'requirements-chhss.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chhss-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: worker
      - uses: actions/checkout@v6
        with:
          ref: main
          path: publication
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements-chhss.txt
      - name: Install maintained processing runtime
        run: python -m pip install -r worker/requirements-chhss.txt
      - name: Test science and publication contracts
        working-directory: worker
        run: python -m unittest discover -s tests -v
      - name: Retrieve and process real observations
        id: process
        continue-on-error: true
        env:
          PYTHONPATH: worker
        run: python -u -m chhss.live --output product
      - name: Publish current measurements and dashboard feed
        if: always() && github.ref == 'refs/heads/main' && steps.process.outcome != 'skipped'
        env:
          PYTHONPATH: ${{ github.workspace }}/worker
        run: |
          set -euo pipefail
          test -s product/status.json
          cd publication
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p chhss-data
            cp ../product/status.json chhss-data/status.json
            for file in current.json recurrence.json; do
              if [ -f "../product/$file" ]; then cp "../product/$file" "chhss-data/$file"; fi
            done
            if [ -d ../product/live-ledger ]; then
              mkdir -p chhss-data/live-ledger
              cp ../product/live-ledger/*.json chhss-data/live-ledger/
            fi
            python -m chhss.publish --root chhss-data
            git add chhss-data
            if git diff --cached --quiet; then break; fi
            git commit -m 'Refresh registered CH/HSS observations and dashboard feed'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Preserve run evidence
        if: always()
        run: |
          mkdir -p product/source
          cp worker/chhss/*.py product/source/
          cp worker/requirements-chhss.txt product/source/
          git -C worker rev-parse HEAD > product/source-commit.txt
          python -m pip freeze > product/environment.txt
          if [ -d .chhss-cache/quality ]; then cp -r .chhss-cache/quality product/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chhss-live-evidence
          path: product/
          retention-days: 30
      - name: Fail visibly when science input was unavailable
        if: steps.process.outcome != 'success'
        run: exit 1
