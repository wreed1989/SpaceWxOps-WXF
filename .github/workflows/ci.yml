name: Maintained application checks
on:
  pull_request:
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  chhss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-chhss.txt
      - run: python -m pip install -r requirements-chhss.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_dashboard.cjs
  flare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-runtime-pinned.txt
      - run: python -m pip install -r requirements-runtime-pinned.txt
      - run: python -m unittest -v test_sharp_mag_pipeline.py test_solar_monitor_guidance.py test_external_flare_guidance_strict_v4.py test_external_source_audit.py test_publication_guard.py
