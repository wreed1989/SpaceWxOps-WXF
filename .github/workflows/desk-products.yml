name: Desk CME and Electron Products
on:
  schedule:
    - cron: '11 * * * *'
  push:
    branches: [main]
    paths: ['ops_refresh/**', '.github/workflows/desk-products.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desk-products
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-chhss.txt
      - name: Install reviewed numerical runtime
        run: python -m pip install -r requirements-chhss.txt
      - name: Restore bounded observation cache
        uses: actions/cache@v4
        with:
          path: .ops-cache
          key: ops-observations-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ops-observations-${{ runner.os }}-
      - name: Issue frozen WXF electron model
        id: electron
        continue-on-error: true
        timeout-minutes: 14
        run: |
          mkdir -p ops-product ops-evidence
          python research/electron_fluence/refresh.py --cache .ops-cache/electron --output ops-product/electron-fluence.json --evidence ops-evidence/electron
      - name: Collect public CME products and SWPC REFM
        id: collect
        continue-on-error: true
        timeout-minutes: 6
        run: python ops_refresh/collect.py ops-product
      - name: Check publication contracts
        run: |
          python -m py_compile ops_refresh/collect.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('ops-product/manifest.json')
          assert p.exists(), 'No collection manifest'
          d=json.loads(p.read_text())
          assert d['schemaVersion']=='ops-delivery-1'
          f=Path('ops-product/electron-fluence.json')
          if f.exists():
              e=json.loads(f.read_text())
              assert e['schemaVersion']=='WXF-EF-0.2'
              assert e['status'] in ['experimental','withheld']
              assert len(e['forecast'])==(24 if e['status']=='experimental' else 0)
          PY
      - name: Publish isolated rolling delivery branch
        if: always() && steps.collect.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin ops-live >/dev/null; then
            git fetch origin ops-live
            git worktree add --detach ../ops-publication FETCH_HEAD
          else
            git worktree add --detach ../ops-publication HEAD
            git -C ../ops-publication checkout --orphan ops-live
            git -C ../ops-publication rm -rf . >/dev/null
          fi
          cp ops-product/* ../ops-publication/
          cd ../ops-publication
          git add .
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh dated CME and electron products'
            git push origin HEAD:ops-live
          fi
      - name: Preserve actual run and source evidence
        if: always()
        run: |
          mkdir -p ops-evidence/source
          cp -r research/electron_fluence ops-evidence/source/
          cp -r ops_refresh ops-evidence/source/
          cp requirements-chhss.txt ops-evidence/source/
          git rev-parse HEAD > ops-evidence/source-commit.txt
          python -m pip freeze > ops-evidence/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desk-products-evidence
          path: |
            ops-product/
            ops-evidence/
          retention-days: 14
      - name: Report failed execution separately from source status
        if: steps.collect.outcome != 'success' || steps.electron.outcome != 'success'
        run: exit 1
