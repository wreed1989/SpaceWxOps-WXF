name: ESA Solar Products
on:
  workflow_dispatch:
  push:
    branches: [esa-product-delivery]
    paths: [esa/harvest.py, .github/workflows/esa-products.yml]
permissions:
  contents: read
concurrency:
  group: esa-solar-products
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Image Validator
        run: python3 -m pip install Pillow==11.3.0
      - name: Validate Syntax
        run: python3 -m py_compile esa/harvest.py esa/check_access.py
      - name: Collect Authenticated Products
        env:
          ESAID: ${{ secrets.ESAID }}
          ESASECRET: ${{ secrets.ESASECRET }}
        run: python3 esa/harvest.py
      - name: Inspect Remaining A-EFFort Source
        env:
          ESAID: ${{ secrets.ESAID }}
          ESASECRET: ${{ secrets.ESASECRET }}
          ESA_OUTPUT_DIR: esa-diagnostic
        run: python3 esa/aeffort_feed_probe.py
      - name: Preserve Tested Source
        if: always()
        run: |
          mkdir -p release-source
          cp esa/*.py release-source/
          cp esa/*.js release-source/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: esa-production-validation
          path: |
            esa-live-output/
            esa-diagnostic/
            release-source/
          retention-days: 3
          if-no-files-found: error
