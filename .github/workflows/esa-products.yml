name: ESA Solar Products
on:
  workflow_dispatch:
  push:
    branches: [esa-product-delivery]
    paths: [esa/resolve_aeffort.py, .github/workflows/esa-products.yml]
permissions:
  contents: read
concurrency:
  group: esa-solar-products
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Image Validator
        run: python3 -m pip install Pillow==11.3.0
      - name: Resolve Current Provider
        env:
          ESAID: ${{ secrets.ESAID }}
          ESASECRET: ${{ secrets.ESASECRET }}
        run: python3 esa/resolve_aeffort.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: esa-solar-products
          path: esa-products/
          retention-days: 3
          if-no-files-found: error
