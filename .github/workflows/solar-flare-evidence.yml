name: Solar Flare Evidence
on:
  workflow_dispatch:
  push:
    branches: [solar-flare-review, main]
    paths: ['flare/**', '.github/workflows/solar-flare-evidence.yml']
  schedule:
    - cron: '47 */4 * * *'
permissions:
  contents: write
concurrency:
  group: solar-flare-evidence
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-runtime-pinned.txt
      - name: Install frozen model runtime and image decoder
        run: |
          python -m pip install -r requirements-runtime-pinned.txt
          python -m pip install Pillow
      - uses: actions/cache@v4
        with:
          path: flare-cache
          key: flare-archive-${{ github.run_id }}
          restore-keys: flare-archive-
      - name: Test current model contract
        run: python -m unittest -q test_sharp_mag_pipeline.py
      - name: Collect imagery and completed post-training records
        run: python flare/refresh_evidence.py --output flare-output --database
      - name: Archive verifiable source and products
        if: always()
        run: |
          mkdir -p flare-verification/source
          cp -r flare flare-verification/source/
          cp .github/workflows/solar-flare-evidence.yml flare-verification/source/
          test ! -d flare-output || cp -r flare-output flare-verification/
          test ! -f sharp_mag_training_report.json || cp sharp_mag_training_report.json flare-verification/source/
          git rev-parse HEAD > flare-verification/source/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-flare-evidence
          path: flare-verification/
          retention-days: 7
      - name: Publish verified passive feed
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -s flare-output/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          temp=$(mktemp -d)
          if git fetch origin flare-live; then
            git worktree add "$temp/feed" origin/flare-live
          else
            git worktree add --detach "$temp/feed" HEAD
            (cd "$temp/feed" && git checkout --orphan flare-live && git rm -rf .)
          fi
          rsync -a --delete --exclude=.git flare-output/ "$temp/feed/"
          cd "$temp/feed"
          git add -A
          git diff --cached --quiet || git commit -m 'Refresh registered Solar Flare evidence and completed-label database'
          git push origin HEAD:refs/heads/flare-live
