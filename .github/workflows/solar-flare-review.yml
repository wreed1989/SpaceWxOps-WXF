name: Solar Flare Review
on:
  push:
    branches: [solar-flare-review]
    paths: ['.github/workflows/solar-flare-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Capture model source and current observation metadata
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, datetime as dt, hashlib, json, pathlib, shutil, subprocess, urllib.request, urllib.parse
          root=pathlib.Path('review-artifact'); root.mkdir()
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          copied=[]
          for name in files:
              p=pathlib.Path(name)
              allow=(len(p.parts)==1 and p.suffix in {'.py','.json','.joblib','.csv','.md','.txt','.jsonl'}) or name.startswith(('datasets/','models/','esa/','.github/workflows/'))
              if not allow or not p.is_file() or p.stat().st_size>80000000: continue
              dest=root/'repository'/name; dest.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(p,dest)
              copied.append({'path':name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          now=dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          (root/'manifest.json').write_text(json.dumps({'checked_at':now,'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':copied},indent=2))
          urls={
             'noaa_regions':'https://services.swpc.noaa.gov/json/solar_regions.json',
             'noaa_events':'https://services.swpc.noaa.gov/json/edited_events.json',
             'swpc_probabilities':'https://services.swpc.noaa.gov/text/3-day-solar-geomag-predictions.txt',
             'hmi_continuum':'https://api.helioviewer.org/v2/getClosestImage/?'+urllib.parse.urlencode({'date':now,'sourceId':18}),
             'hmi_magnetogram':'https://api.helioviewer.org/v2/getClosestImage/?'+urllib.parse.urlencode({'date':now,'sourceId':19}),
             'aia_171':'https://api.helioviewer.org/v2/getClosestImage/?'+urllib.parse.urlencode({'date':now,'sourceId':10})}
          def get(item):
             key,url=item
             try:
                req=urllib.request.Request(url,headers={'User-Agent':'SpaceWxOps-WXF/solar-flare-review'})
                with urllib.request.urlopen(req,timeout=40) as r: data=r.read(18000000); status=r.status; ctype=r.headers.get('Content-Type','')
                dest=root/'observations'/(key+'.json' if 'json' in ctype else key+'.txt'); dest.parent.mkdir(exist_ok=True); dest.write_bytes(data)
                return key,{'ok':status==200,'status':status,'content_type':ctype,'bytes':len(data),'url':url}
             except Exception as e: return key,{'ok':False,'error':str(e)[:240],'url':url}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: results=dict(pool.map(get,urls.items()))
          (root/'provider-checks.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: solar-flare-review
          path: review-artifact/
          retention-days: 7
          include-hidden-files: true
