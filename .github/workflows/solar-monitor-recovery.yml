name: Recover delayed SolarMonitor flare guidance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/solar-monitor-recovery.yml"
      - "solar_monitor_guidance.py"
      - "publication_guard.py"
      - "test_publication_guard.py"
  schedule:
    # SolarMonitor's new 00Z table is not always populated during the formal
    # 21Z/22Z/23Z/00Z WXF attempts. Recheck the same published forecast later.
    - cron: "20 3,6,9,12,15,18 * * *"

permissions:
  contents: write

concurrency:
  # Serialize every writer of flare_guidance.json and forecast_history.jsonl.
  group: wxf-flare-guidance-publication
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install SolarMonitor runtime
        shell: bash
        run: python -m pip install requests==2.32.4

      - name: Test semantic publication guard
        run: python -m unittest -v test_publication_guard.py

      - name: Recover current SolarMonitor MCSTAT and MCEVOL
        shell: bash
        run: |
          set -euo pipefail

          set +e
          solar_output=$(python solar_monitor_guidance.py enrich \
            --input flare_guidance.json \
            --output flare_guidance.json \
            --js-output flare_guidance.js 2>&1)
          solar_status=$?
          set -e

          if [[ -n "$solar_output" ]]; then
            printf '%s\n' "$solar_output"
          fi

          if [[ "$solar_status" -ne 0 ]]; then
            echo "::notice title=SolarMonitor table not ready::No parseable current SolarMonitor table was available. The published forecast is unchanged and the next recovery pass will try again."
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("flare_guidance.json").read_text(encoding="utf-8"))
          solar = payload.get("solar_monitor")
          assert isinstance(solar, dict), "solar_monitor metadata missing"

          found = []
          for region in payload.get("regions", []):
              if not isinstance(region, dict):
                  continue
              members = region.get("members")
              if not isinstance(members, dict):
                  continue
              for key in ("mcstat", "mcevol"):
                  member = members.get(key)
                  if not isinstance(member, dict):
                      continue
                  assert "solarmonitor" in str(member.get("source") or "").lower(), (
                      region.get("id"), key, member.get("source")
                  )
                  found.append((region.get("id"), key))

          assert found, "SolarMonitor enrichment produced no MCSTAT/MCEVOL members"
          print(f"Validated {len(found)} SolarMonitor probability members for {payload.get('valid_start')}.")
          PY

      - name: Publish recovered SolarMonitor guidance
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flare_guidance.json flare_guidance.js

          if git diff --cached --quiet; then
            echo "SolarMonitor recovery produced no change."
            exit 0
          fi

          issued=$(python -c 'import json; print(json.load(open("flare_guidance.json"))["issued"])')
          snapshot_dir=$(mktemp -d)
          trap 'rm -rf "$snapshot_dir"' EXIT
          cp flare_guidance.json flare_guidance.js "$snapshot_dir"/

          cat > "$snapshot_dir/merge_history.py" <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("flare_guidance.json").read_text(encoding="utf-8"))
          issued = payload["issued"]
          history = Path("forecast_history.jsonl")
          lines = [line for line in history.read_text(encoding="utf-8").splitlines() if line.strip()] if history.exists() else []
          replacement = json.dumps(payload, separators=(",", ":"))
          output = []
          replaced = False

          for line in lines:
              try:
                  record = json.loads(line)
              except json.JSONDecodeError:
                  output.append(line)
                  continue
              if record.get("issued") == issued:
                  if not replaced:
                      output.append(replacement)
                      replaced = True
              else:
                  output.append(line)

          if not replaced:
              output.append(replacement)
          history.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python publication_guard.py \
              --previous-payload flare_guidance.json \
              --candidate-payload "$snapshot_dir/flare_guidance.json" \
              --github-output "$snapshot_dir/publication.env"
            source "$snapshot_dir/publication.env"
            if [[ "$publish" != "true" ]]; then
              echo "SolarMonitor recovery changed retrieval metadata only; no commit is required."
              exit 0
            fi
            cp "$snapshot_dir/flare_guidance.json" flare_guidance.json
            cp "$snapshot_dir/flare_guidance.js" flare_guidance.js
            python "$snapshot_dir/merge_history.py"
            git add flare_guidance.json flare_guidance.js forecast_history.jsonl

            if git diff --cached --quiet; then
              echo "The recovered SolarMonitor guidance is already published."
              exit 0
            fi

            git commit -m "Recover SolarMonitor flare guidance ${issued}"
            if git push origin HEAD:main; then
              echo "Recovered SolarMonitor guidance published successfully."
              exit 0
            fi

            if [[ "$attempt" -lt 4 ]]; then
              echo "::notice title=Concurrent repository update::main advanced during SolarMonitor publication; refreshing and retrying."
              sleep $((attempt * 2))
            fi
          done

          echo "::error title=SolarMonitor publication failed::Unable to publish after four attempts."
          exit 1
