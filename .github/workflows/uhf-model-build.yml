name: UHF model build assets
on:
  push:
    branches: [uhf-model-build-20260926]
    paths: ['.github/workflows/uhf-model-build.yml', 'tools/uhf-build/**']
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/uhf-build
          persist-credentials: false
      - name: Prepare numerical model environment
        run: |
          python3 -m venv /tmp/uhf-env
          /tmp/uhf-env/bin/python -m pip install numpy apexpy
      - name: Build offline model reference assets
        run: /tmp/uhf-env/bin/python tools/uhf-build/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uhf-model-reference-assets
          path: model-assets
          retention-days: 7
          if-no-files-found: error
