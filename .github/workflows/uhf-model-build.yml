name: UHF model build assets
on:
  push:
    branches: [uhf-model-build-20260926]
    paths: ['.github/workflows/uhf-model-build.yml', 'tools/uhf-build/**']
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/uhf-build
          persist-credentials: false
      - name: Run public WBMOD probe
        run: python3 tools/uhf-build/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uhf-wbmod-probe
          path: model-assets
          retention-days: 7
          if-no-files-found: error
