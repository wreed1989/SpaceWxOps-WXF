name: Update daily multi-source flare guidance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wxf-daily.yml"
      - "solar_monitor_guidance.py"
      - "external_flare_guidance.py"
      - "external_flare_guidance_fixed.py"
      - "external_flare_guidance_strict_v3.py"
      - "external_flare_guidance_strict_v4.py"
      - "test_external_flare_guidance_strict_v4.py"
      - "external_source_audit.py"
      - "test_solar_monitor_guidance.py"
      - "test_external_source_audit.py"
      - "publication_guard.py"
      - "test_publication_guard.py"
      - "sharp_mag_pipeline.py"
      - "test_sharp_mag_pipeline.py"
  schedule:
    # Formal 21Z WXF issue plus retries for delayed HMI/SHARP and provider feeds.
    - cron: "20 21 * * *"
    - cron: "20 22 * * *"
    - cron: "20 23 * * *"
    - cron: "20 0 * * *"

permissions:
  contents: write

concurrency:
  # Share the publication lock with the 12Z external-only refresh.
  group: wxf-flare-guidance-publication
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The publish step rebases itself onto the latest main branch if a
          # human or another workflow commits while this run is generating data.
          fetch-depth: 0

      - name: Set up Python used to train the frozen model
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-runtime-pinned.txt
            requirements-sharp-mag.txt

      - name: Install the frozen model runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements-runtime-pinned.txt ]]; then
            python -m pip install -r requirements-runtime-pinned.txt
          else
            python -m pip install -r requirements-sharp-mag.txt
          fi

      - name: Test model, provider, and publication guards
        run: python -m unittest -v test_sharp_mag_pipeline.py test_solar_monitor_guidance.py test_external_flare_guidance_strict_v4.py test_external_source_audit.py test_publication_guard.py

      - name: Generate the formal 21Z WXF forecast
        shell: bash
        run: |
          set -euo pipefail

          previous_dir=$(mktemp -d)
          trap 'rm -rf "$previous_dir"' EXIT
          if [[ -s flare_guidance.json ]]; then
            cp flare_guidance.json "$previous_dir/flare_guidance.json"
          fi
          if [[ -s flare_guidance.js ]]; then
            cp flare_guidance.js "$previous_dir/flare_guidance.js"
          fi

          generated=0
          last_status=1
          for attempt in 1 2 3; do
            echo "WXF/JSOC attempt ${attempt} of 3"
            set +e
            attempt_output=$(python sharp_mag_pipeline.py forecast \
              --model-dir . \
              --output flare_guidance.json \
              --js-output flare_guidance.js \
              --issue-time cycle \
              --issue-hour 21 \
              --input-lag-hours 3 \
              --max-longitude 50 2>&1)
            last_status=$?
            set -e

            if [[ -n "$attempt_output" ]]; then
              printf '%s\n' "$attempt_output"
            fi
            if [[ "$last_status" -eq 0 ]]; then
              generated=1
              break
            fi

            echo "::notice title=WXF source retry::JSOC/SHARP attempt ${attempt} failed with exit code ${last_status}. The workflow will retry before using the prior published WXF probabilities."
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done

          if [[ "$generated" -eq 0 ]]; then
            if [[ ! -s "$previous_dir/flare_guidance.json" || ! -s "$previous_dir/flare_guidance.js" ]]; then
              echo "::error title=WXF generation failed::JSOC/SHARP failed after three attempts and no prior forecast exists to retain."
              exit "$last_status"
            fi

            cp "$previous_dir/flare_guidance.json" flare_guidance.json
            cp "$previous_dir/flare_guidance.js" flare_guidance.js
            WXF_LAST_STATUS="$last_status" python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          UTC = dt.timezone.utc

          def iso_z(value):
              return value.astimezone(UTC).isoformat(timespec="seconds").replace("+00:00", "Z")

          path = Path("flare_guidance.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          status = int(os.environ.get("WXF_LAST_STATUS", "1"))
          now = dt.datetime.now(tz=UTC)
          formal_issue = now.replace(hour=21, minute=0, second=0, microsecond=0)
          if now < formal_issue:
              formal_issue -= dt.timedelta(days=1)
          valid_start = dt.datetime.combine(
              formal_issue.date() + dt.timedelta(days=1),
              dt.time(0),
              tzinfo=UTC,
          )
          previous_issued = payload.get("issued")

          # Retain only the most recent WXF magnetic member. Every independent
          # source is refreshed below so stale external values cannot masquerade
          # as current guidance when JSOC itself is temporarily unavailable.
          for region in payload.get("regions", []):
              if not isinstance(region, dict):
                  continue
              members = region.get("members")
              if not isinstance(members, dict):
                  continue
              for key in list(members):
                  if key != "sharpmag":
                      members.pop(key, None)
              wxf = members.get("sharpmag")
              if isinstance(wxf, dict):
                  wxf["issued"] = previous_issued
                  wxf["quality"] = "stale-fallback"
                  wxf["note"] = (
                      "Previous published WXF magnetic probability retained because "
                      "the current JSOC/SHARP query timed out after three attempts."
                  )

          payload.pop("solar_monitor", None)
          payload.pop("external_sources", None)
          payload["issued"] = iso_z(formal_issue)
          payload["valid_start"] = iso_z(valid_start)
          payload["valid_end"] = iso_z(valid_start + dt.timedelta(days=1))
          input_meta = payload.setdefault("input", {})
          input_meta["attempted_target_time"] = iso_z(formal_issue - dt.timedelta(hours=3))
          input_meta["fallback_from_previous_cycle"] = True
          payload["generation_status"] = {
              "ok": False,
              "used_previous_forecast": True,
              "previous_issued": previous_issued,
              "attempts": 3,
              "exit_code": status,
              "checked_at": iso_z(now),
              "detail": (
                  "JSOC/SHARP retrieval failed after three attempts. The prior WXF "
                  "magnetic probability was retained transparently while all "
                  "independent forecast sources were refreshed."
              ),
          }
          quality = payload.setdefault("quality", {})
          quality["level"] = "degraded"
          quality["message"] = (
              "WXF input refresh unavailable; prior published WXF probabilities retained."
          )
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          Path("flare_guidance.js").write_text(
              "/* Generated automatically by the SpaceWxOps WXF workflow. */\n"
              "window.FLARE_GUIDANCE_PAYLOAD = "
              + json.dumps(payload, indent=2)
              + ";\n",
              encoding="utf-8",
          )
          PY
            echo "::warning title=Prior WXF cycle retained::JSOC/SHARP remained unavailable after three attempts. External sources will still refresh, and later scheduled runs will retry the WXF input."
          fi

      - name: Add SolarMonitor MCSTAT and MCEVOL guidance
        shell: bash
        run: |
          # Use the latest issue-date SolarMonitor table as a current comparison.
          # Its own daily window remains explicit and is not presented as an exact
          # match to WXF's next-calendar-day target.
          set +e
          solar_output=$(python solar_monitor_guidance.py enrich \
            --input flare_guidance.json \
            --output flare_guidance.json \
            --js-output flare_guidance.js 2>&1)
          solar_status=$?
          set -e

          if [[ -n "$solar_output" ]]; then
            printf '%s\n' "$solar_output"
          fi

          case "$solar_status" in
            0)
              echo "SolarMonitor guidance added successfully."
              ;;
            2)
              echo "::notice title=SolarMonitor guidance unavailable::The current issue-date SolarMonitor table is not available or parseable. Continuing with WXF and the other independently verified sources."
              ;;
            *)
              echo "::warning title=SolarMonitor refresh incomplete::solar_monitor_guidance.py exited with code ${solar_status}. MCSTAT/MCEVOL remain unavailable; continuing with WXF and the other independently verified sources."
              ;;
          esac

      - name: Add SIDC, Met Office, FLARECAST, and NASA CCMC guidance
        shell: bash
        run: |
          set +e
          external_output=$(python external_flare_guidance_strict_v4.py \
            --input flare_guidance.json \
            --output flare_guidance.json \
            --js-output flare_guidance.js 2>&1)
          external_status=$?
          set -e

          if [[ -n "$external_output" ]]; then
            printf '%s\n' "$external_output"
          fi
          if [[ "$external_status" -eq 0 ]]; then
            echo "Independent flare guidance refresh completed."
          else
            echo "::warning title=External guidance refresh incomplete::The external adapter exited with code ${external_status}. The validated WXF/SolarMonitor payload is retained, and the next scheduled run will retry the unavailable sources."
          fi

      - name: Record external-provider availability transitions
        shell: bash
        run: |
          python external_source_audit.py \
            --payload flare_guidance.json \
            --audit-output external_source_audit.json

      - name: Validate combined forecast product
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          payload = json.loads(Path("flare_guidance.json").read_text(encoding="utf-8"))
          assert payload.get("model_version"), "model_version missing"
          assert payload.get("operational") is False, "research flag unexpectedly changed"
          assert payload.get("probability_scale") == "percent"

          issued = dt.datetime.fromisoformat(payload["issued"].replace("Z", "+00:00"))
          assert issued.hour == 21 and issued.minute == 0, issued

          regions = payload.get("regions") or []
          assert regions, "no forecast regions"
          full_disk = next((region for region in regions if region.get("id") == "full-disk"), None)
          assert full_disk, "full-disk row missing"
          full_members = full_disk.get("members", {})
          assert full_members.get("sharpmag"), "full-disk WXF probability missing"
          assert full_members.get("swpc"), "official SWPC full-disk benchmark missing"
          coverage = payload.get("wxf_full_disk") or {}
          assert coverage.get("method") == "union_of_unique_region_components", coverage
          numbered = [region for region in regions if region.get("id") != "full-disk"]
          assert numbered, "no numbered active regions"
          assert all((region.get("members") or {}).get("sharpmag") for region in numbered), \
              "every numbered region must publish a WXF value or an explicit fallback"

          count = 0
          for region in regions:
              members = region.get("members", {})
              assert isinstance(members, dict), (region.get("id"), "members must be an object")
              assert "ensemble" not in members
              for key, member in members.items():
                  if not isinstance(member, dict):
                      continue
                  count += 1
                  m1 = member.get("m1")
                  x1 = member.get("x1")
                  if m1 is not None:
                      assert 0 <= float(m1) <= 100, (region.get("id"), key, m1)
                  if x1 is not None:
                      assert 0 <= float(x1) <= 100, (region.get("id"), key, x1)
                  if m1 is not None and x1 is not None:
                      assert float(x1) <= float(m1), (region.get("id"), key, m1, x1)

          external_keys = sorted(
              key for key, value in full_members.items()
              if key not in {"sharpmag", "mcstat", "mcevol", "evolp", "swpc"}
              and isinstance(value, dict)
          )
          print(
              f"Validated {payload['model_version']} issued {payload['issued']} with "
              f"{count} probability members; current independent full-disk rows="
              f"{external_keys if external_keys else 'none current'}"
          )
          if payload.get("generation_status"):
              print(json.dumps(payload["generation_status"], indent=2))
          if payload.get("external_sources"):
              print(json.dumps(payload["external_sources"], indent=2))

          audit = json.loads(Path("external_source_audit.json").read_text(encoding="utf-8"))
          assert audit.get("schema_version") == 1, "external audit schema missing"
          assert isinstance(audit.get("providers"), dict), "external audit providers missing"
          print(json.dumps(audit.get("summary", {}), indent=2))
          PY

      - name: Store the latest version of this formal forecast
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("flare_guidance.json").read_text(encoding="utf-8"))
          issued = payload["issued"]
          history = Path("forecast_history.jsonl")
          lines = [line for line in history.read_text(encoding="utf-8").splitlines() if line.strip()] if history.exists() else []
          replacement = json.dumps(payload, separators=(",", ":"))
          output = []
          replaced = False

          for line in lines:
              try:
                  record = json.loads(line)
              except json.JSONDecodeError:
                  output.append(line)
                  continue
              if record.get("issued") == issued:
                  if not replaced:
                      output.append(replacement)
                      replaced = True
              else:
                  output.append(line)

          if not replaced:
              output.append(replacement)
          history.write_text("\n".join(output) + "\n", encoding="utf-8")
          print(f"Stored latest forecast version for {issued}.")
          PY

      - name: Publish updated forecast files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          issued=$(python -c 'import json; print(json.load(open("flare_guidance.json"))["issued"])')
          snapshot_dir=$(mktemp -d)
          trap 'rm -rf "$snapshot_dir"' EXIT
          cp flare_guidance.json flare_guidance.js external_source_audit.json "$snapshot_dir"/

          cat > "$snapshot_dir/merge_history.py" <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("flare_guidance.json").read_text(encoding="utf-8"))
          issued = payload["issued"]
          history = Path("forecast_history.jsonl")
          lines = [line for line in history.read_text(encoding="utf-8").splitlines() if line.strip()] if history.exists() else []
          replacement = json.dumps(payload, separators=(",", ":"))
          output = []
          replaced = False

          for line in lines:
              try:
                  record = json.loads(line)
              except json.JSONDecodeError:
                  output.append(line)
                  continue
              if record.get("issued") == issued:
                  if not replaced:
                      output.append(replacement)
                      replaced = True
              else:
                  output.append(line)

          if not replaced:
              output.append(replacement)
          history.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

          # A human commit or another writer may advance main while the forecast
          # is being built. Rebase by resetting to the newest main, restoring the
          # generated payload, and rebuilding history against that newest copy.
          # A rejected push is retried instead of failing with a non-fast-forward.
          for attempt in 1 2 3 4; do
            echo "Publish attempt ${attempt} of 4"
            git fetch origin main
            git reset --hard origin/main
            python publication_guard.py \
              --previous-payload flare_guidance.json \
              --candidate-payload "$snapshot_dir/flare_guidance.json" \
              --previous-audit external_source_audit.json \
              --candidate-audit "$snapshot_dir/external_source_audit.json" \
              --github-output "$snapshot_dir/publication.env"
            source "$snapshot_dir/publication.env"
            if [[ "$publish" != "true" ]]; then
              echo "Scheduled production completed with no forecast or provider-state change; no commit is required."
              exit 0
            fi
            cp "$snapshot_dir/flare_guidance.json" flare_guidance.json
            cp "$snapshot_dir/flare_guidance.js" flare_guidance.js
            cp "$snapshot_dir/external_source_audit.json" external_source_audit.json
            python "$snapshot_dir/merge_history.py"

            git add flare_guidance.json flare_guidance.js external_source_audit.json forecast_history.jsonl
            if git diff --cached --quiet; then
              echo "Forecast files already match the latest main branch."
              exit 0
            fi

            git commit -m "Update multi-source flare guidance ${issued}"
            if git push origin HEAD:main; then
              echo "Forecast files published successfully."
              exit 0
            fi

            if [[ "$attempt" -lt 4 ]]; then
              echo "::notice title=Concurrent repository update::main advanced during publication. Refreshing from origin and retrying without discarding the generated forecast."
              sleep $((attempt * 2))
            fi
          done

          echo "::error title=Forecast publication failed::Unable to publish after four fetch-reset-reapply attempts."
          exit 1
