name: Update daily multi-source flare guidance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wxf-daily.yml"
      - "solar_monitor_guidance.py"
      - "external_flare_guidance.py"
      - "external_flare_guidance_fixed.py"
      - "external_flare_guidance_strict_v3.py"
      - "external_flare_guidance_strict_v4.py"
      - "sharp_mag_pipeline.py"
  schedule:
    # Formal 21Z WXF issue plus retries for delayed HMI/SHARP and provider feeds.
    - cron: "20 21 * * *"
    - cron: "20 22 * * *"
    - cron: "20 23 * * *"
    - cron: "20 0 * * *"

permissions:
  contents: write

concurrency:
  group: wxf-daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python used to train the frozen model
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-runtime-pinned.txt
            requirements-sharp-mag.txt

      - name: Install the frozen model runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements-runtime-pinned.txt ]]; then
            python -m pip install -r requirements-runtime-pinned.txt
          else
            python -m pip install -r requirements-sharp-mag.txt
          fi

      - name: Generate the formal 21Z WXF forecast
        shell: bash
        run: |
          python sharp_mag_pipeline.py forecast \
            --model-dir . \
            --output flare_guidance.json \
            --js-output flare_guidance.js \
            --issue-time cycle \
            --issue-hour 21 \
            --input-lag-hours 3 \
            --max-longitude 45

      - name: Add SolarMonitor MCSTAT and MCEVOL guidance
        continue-on-error: true
        shell: bash
        run: |
          python solar_monitor_guidance.py enrich \
            --input flare_guidance.json \
            --output flare_guidance.json \
            --js-output flare_guidance.js

      - name: Apply conservative WXF full-disk proxy
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path("flare_guidance.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          regions = [row for row in payload.get("regions", []) if isinstance(row, dict)]
          full = next((row for row in regions if row.get("id") == "full-disk"), None)
          regional = [row for row in regions if row.get("id") != "full-disk"]
          wxf_members = [
              row.get("members", {}).get("sharpmag")
              for row in regional
              if isinstance(row.get("members", {}).get("sharpmag"), dict)
          ]

          def maximum(key):
              values = []
              for member in wxf_members:
                  try:
                      value = float(member.get(key))
                  except (TypeError, ValueError):
                      continue
                  if math.isfinite(value) and 0 <= value <= 100:
                      values.append(value)
              return max(values) if values else None

          if full is not None and wxf_members:
              m1 = maximum("m1")
              x1 = maximum("x1")
              if m1 is not None or x1 is not None:
                  if m1 is not None and x1 is not None:
                      x1 = min(x1, m1)
                  full.setdefault("members", {})["sharpmag"] = {
                      "m1": m1,
                      "x1": x1,
                      "source": (
                          f"WXF dominant-region proxy (maximum of {len(wxf_members)} "
                          "quality-controlled regional forecasts)"
                      ),
                      "quality": "research-dominant-region-proxy",
                  }
                  payload["wxf_full_disk"] = {
                      "method": "maximum regional probability (dominant-region proxy)",
                      "regional_forecasts": len(wxf_members),
                      "note": (
                          "Interim full-disk display proxy. It avoids an inflated "
                          "independence-union calculation but is not a separately "
                          "trained or calibrated full-disk model."
                      ),
                  }

          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          Path("flare_guidance.js").write_text(
              "/* Generated automatically by the SpaceWxOps WXF workflow. */\n"
              "window.FLARE_GUIDANCE_PAYLOAD = "
              + json.dumps(payload, indent=2)
              + ";\n",
              encoding="utf-8",
          )
          PY

      - name: Add SIDC, Met Office, FLARECAST, and NASA CCMC guidance
        continue-on-error: true
        shell: bash
        run: |
          python external_flare_guidance_strict_v4.py \
            --input flare_guidance.json \
            --output flare_guidance.json \
            --js-output flare_guidance.js

      - name: Validate combined forecast product
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          payload = json.loads(Path("flare_guidance.json").read_text(encoding="utf-8"))
          assert payload.get("model_version"), "model_version missing"
          assert payload.get("operational") is False, "research flag unexpectedly changed"
          assert payload.get("probability_scale") == "percent"

          issued = dt.datetime.fromisoformat(payload["issued"].replace("Z", "+00:00"))
          assert issued.hour == 21 and issued.minute == 0, issued

          regions = payload.get("regions") or []
          assert regions, "no forecast regions"
          full_disk = next((region for region in regions if region.get("id") == "full-disk"), None)
          assert full_disk, "full-disk row missing"
          full_members = full_disk.get("members", {})
          assert full_members.get("sharpmag"), "full-disk WXF probability missing"

          allowed = (
              "sharpmag", "mcstat", "mcevol", "sidc", "metoffice", "flarecast",
              "ccmc_magpy", "ccmc_mag4", "ccmc_daffs", "ccmc_aeffort", "swpc",
          )
          count = 0
          for region in regions:
              members = region.get("members", {})
              assert "ensemble" not in members
              assert "evolp" not in members and "evol_p" not in members
              for key in allowed:
                  member = members.get(key)
                  if not isinstance(member, dict):
                      continue
                  count += 1
                  m1 = member.get("m1")
                  x1 = member.get("x1")
                  if m1 is not None:
                      assert 0 <= float(m1) <= 100, (region.get("id"), key, m1)
                  if x1 is not None:
                      assert 0 <= float(x1) <= 100, (region.get("id"), key, x1)
                  if m1 is not None and x1 is not None:
                      assert float(x1) <= float(m1), (region.get("id"), key, m1, x1)

          available = [
              key for key in (
                  "sidc", "metoffice", "flarecast", "ccmc_magpy", "ccmc_mag4",
                  "ccmc_daffs", "ccmc_aeffort",
              )
              if isinstance(full_members.get(key), dict)
          ]
          print(
              f"Validated {payload['model_version']} issued {payload['issued']} with "
              f"{count} probability members; external rows="
              f"{available if available else 'none current'}"
          )
          if payload.get("external_sources"):
              print(json.dumps(payload["external_sources"], indent=2))
          PY

      - name: Store the latest version of this formal forecast
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("flare_guidance.json").read_text(encoding="utf-8"))
          issued = payload["issued"]
          history = Path("forecast_history.jsonl")
          lines = [line for line in history.read_text(encoding="utf-8").splitlines() if line.strip()] if history.exists() else []
          replacement = json.dumps(payload, separators=(",", ":"))
          output = []
          replaced = False

          for line in lines:
              try:
                  record = json.loads(line)
              except json.JSONDecodeError:
                  output.append(line)
                  continue
              if record.get("issued") == issued:
                  if not replaced:
                      output.append(replacement)
                      replaced = True
              else:
                  output.append(line)

          if not replaced:
              output.append(replacement)
          history.write_text("\n".join(output) + "\n", encoding="utf-8")
          print(f"Stored latest forecast version for {issued}.")
          PY

      - name: Publish updated forecast files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flare_guidance.json flare_guidance.js forecast_history.jsonl

          if git diff --cached --quiet; then
            echo "Forecast files are unchanged."
          else
            issued=$(python -c 'import json; print(json.load(open("flare_guidance.json"))["issued"])')
            git commit -m "Update multi-source flare guidance ${issued}"
            git push
          fi
