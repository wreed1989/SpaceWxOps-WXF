name: Update daily WXF flare guidance

on:
  workflow_dispatch:
  schedule:
    # Formal 21Z issue plus two retries for delayed JSOC NRT availability.
    # GitHub schedules use UTC. Non-zero minutes reduce top-of-hour congestion.
    - cron: "20 21 * * *"
    - cron: "20 22 * * *"
    - cron: "20 23 * * *"

permissions:
  contents: write

concurrency:
  group: wxf-daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python used to train the frozen model
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-runtime-pinned.txt
            requirements-sharp-mag.txt

      - name: Install the frozen model runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements-runtime-pinned.txt ]]; then
            python -m pip install -r requirements-runtime-pinned.txt
          else
            python -m pip install -r requirements-sharp-mag.txt
          fi

      - name: Generate the formal 21Z WXF forecast
        shell: bash
        run: |
          python sharp_mag_pipeline.py forecast \
            --model-dir . \
            --output flare_guidance.json \
            --js-output flare_guidance.js \
            --issue-time cycle \
            --issue-hour 21 \
            --input-lag-hours 3 \
            --max-longitude 45

      - name: Validate forecast product
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          path = Path("flare_guidance.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload.get("model_version"), "model_version missing"
          assert payload.get("operational") is False, "research flag unexpectedly changed"
          assert payload.get("probability_scale") == "percent"

          issued = dt.datetime.fromisoformat(payload["issued"].replace("Z", "+00:00"))
          assert issued.hour == 21 and issued.minute == 0, issued

          regions = payload.get("regions") or []
          assert regions, "no forecast regions"
          members = [
              region.get("members", {}).get("sharpmag")
              for region in regions
              if region.get("members", {}).get("sharpmag")
          ]
          assert members, "no WXF probabilities"

          for member in members:
              m1 = member.get("m1")
              x1 = member.get("x1")
              if m1 is not None and x1 is not None:
                  assert 0 <= float(x1) <= float(m1) <= 100

          print(
              f"Validated {payload['model_version']} issued {payload['issued']} "
              f"with {len(members)} WXF members"
          )
          PY

      - name: Archive the first successful forecast for this issue time
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("flare_guidance.json").read_text(encoding="utf-8"))
          issued = payload["issued"]
          history = Path("forecast_history.jsonl")

          existing = []
          if history.exists():
              existing = [line for line in history.read_text(encoding="utf-8").splitlines() if line.strip()]

          already_archived = False
          for line in existing:
              try:
                  if json.loads(line).get("issued") == issued:
                      already_archived = True
                      break
              except json.JSONDecodeError:
                  continue

          if already_archived:
              print(f"Forecast {issued} is already present in history.")
          else:
              with history.open("a", encoding="utf-8", newline="\n") as handle:
                  handle.write(json.dumps(payload, separators=(",", ":")) + "\n")
              print(f"Archived forecast {issued}.")
          PY

      - name: Publish updated forecast files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flare_guidance.json flare_guidance.js forecast_history.jsonl

          if git diff --cached --quiet; then
            echo "Forecast files are unchanged."
          else
            issued=$(python -c 'import json; print(json.load(open("flare_guidance.json"))["issued"])')
            git commit -m "Update WXF forecast ${issued}"
            git push
          fi
