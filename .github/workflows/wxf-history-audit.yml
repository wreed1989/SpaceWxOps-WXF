name: WXF Historical Coverage Audit
on:
  workflow_dispatch:
  push:
    branches: [wxf-history-reassessment]
    paths:
      - '.github/workflows/wxf-history-audit.yml'
      - 'flare/history_capture.py'
permissions:
  contents: read
concurrency:
  group: wxf-history-audit
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install analysis dependencies
        run: python -m pip install numpy pandas scipy scikit-learn requests drms joblib packaging
      - name: Capture primary history
        run: python flare/history_capture.py
      - name: Retain raw audit records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WXF-Historical-Coverage
          path: history-capture/
          retention-days: 7
          if-no-files-found: error
