           def test_synthetic_signed_wcs_path(self):
            from chhss.solar import build_pack
            n=128;y,x=np.indices((n,n));image=np.full((n,n),100.,dtype=float);image[(abs(x-64)<9)&(y>33)&(y<63)]=20
            base={'CTYPE1':'HPLN-TAN','CTYPE2':'HPLT-TAN','CUNIT1':'arcsec','CUNIT2':'arcsec','CRPIX1':64.5,'CRPIX2':64.5,'CRVAL1':0.,'CRVAL2':0.,'CDELT1':17.13,'CDELT2':17.13,'DSUN_OBS':149597870700.,'RSUN_OBS':959.23,'RSUN_REF':695700000.,'HGLN_OBS':0.,'HGLT_OBS':0.,'DATE-OBS':'2024-01-01T12:00:00Z','QUALITY':0,'EXPTIME':2.,'TELESCOP':'SDO','WAVEUNIT':'angstrom'}
            maps={w:sunpy.map.Map(image,{**base,'INSTRUME':'AIA','DETECTOR':'AIA','WAVELNTH':w,'BUNIT':'DN'}) for w in [171,193,211]}
            maps['hmi']=sunpy.map.Map(np.ones((n,n))*10,{**base,'INSTRUME':'HMI','DETECTOR':'HMI','WAVELNTH':6173,'BUNIT':'G','CONTENT':'MAGNETOGRAM'})
            p=build_pack(maps,{'channels':{},'hmi':{'series':'hmi.M_720s'}},size=128,historical=True)
            self.assertEqual(p['maskId'],hashlib.sha256(bytes(p['measured']['mask'])).hexdigest());self.assertEqual(p['polarity']['sector']['M']['polarity'],1);self.assertGreater(p['measured']['window']['M']['A'],0)
          if __name__=='__main__':unittest.main(verbosity=2)
          CHHSS_SOURCE_EOF
      - name: Install processing dependencies
        run: python -m pip install -r .chhss-runtime/requirements-chhss.txt
      - name: Restore processing cache
        uses: actions/cache/restore@v4
        with:
          path: .chhss-cache
          key: chhss-${{ runner.os }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            chhss-${{ runner.os }}-v1-
      - name: Numerical and registered-FITS acceptance tests
        working-directory: .chhss-runtime
        run: |
          python -c "import sunpy.map, astropy.units, reproject, drms"
          python -m unittest discover -s tests -p 'test_pipeline.py' -v
      - name: Retrieve current measurements and advance backfill
        id: producer
        continue-on-error: true
        env:
          JSOC_EMAIL: ${{ secrets.JSOC_EMAIL }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_CHUNK: ${{ inputs.chunk }}
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/.chhss-runtime"
          python - <<'PYCODE'
          import os,subprocess,sys
          command=[sys.executable,'-m','chhss.worker','run','--output','chhss-data','--cache','.chhss-cache','--budget-minutes','28']
          for key,flag in [('INPUT_START','--start'),('INPUT_END','--end'),('INPUT_CHUNK','--chunk')]:
              value=os.environ.get(key,'').strip()
              if value:command.extend([flag,value])
          sys.exit(subprocess.call(command))
          PYCODE
      - name: Publish measured feed and explicit failure status
        if: always() && steps.producer.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s chhss-data/feed.json ]]; then
            echo "No producer envelope exists; nothing will be published."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- chhss-data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Coronal Hole / HSS Outlook data'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo 'Publication failed; no force-push was attempted.'
          exit 1
      - name: Save resumable source and staging cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .chhss-cache
          key: chhss-${{ runner.os }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record resolved processing environment
        if: always()
        run: python -m pip freeze > chhss-environment.txt
      - name: Preserve diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chhss-run-${{ github.run_id }}
          path: |
            chhss-data
            chhss-environment.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Report unsuccessful current/truth acquisition
        if: steps.producer.outcome == 'failure'
        run: |
          echo 'Current measurements or truth acquisition failed. Inspect chhss-data/status.json. Previously valid observations were not restamped.'
          exit 1
