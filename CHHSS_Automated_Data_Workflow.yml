          class NumericTests(unittest.TestCase):
           def test_omni_columns_and_fills(self):
            row=['0']*57;row[:3]=['2024','60','23'];row[24]='600';row[23]='8.2';row[22]='95000';row[16]='-6.5';row[38]='53'
            r=parse_line(' '.join(row));self.assertEqual(r['speed'],600);self.assertEqual(r['density'],8.2);self.assertEqual(r['temperature'],95000);self.assertEqual(r['kp'],5.3);self.assertEqual(r['time_tag'],'2024-02-29T23:00:00Z')
            row[24]='9999';self.assertIsNone(parse_line(' '.join(row))['speed'])
           def test_bad_omni_schema(self):
            with self.assertRaises(ValueError):parse_line('<html>unavailable</html>')
           def test_daily_minimum_coverage(self):
            start=datetime(2024,1,1,tzinfo=UTC);rows=[{'time_tag':iso(start+timedelta(hours=i)),'speed':400+i} for i in range(19)]
            self.assertIsNone(daily_means(rows)['2024-01-01']['speed']);rows.append({'time_tag':iso(start+timedelta(hours=19)),'speed':419});self.assertEqual(daily_means(rows)['2024-01-01']['speed'],409.5)
           def test_duplicate_hour_conflict(self):
            with self.assertRaises(ValueError):daily_means([{'time_tag':'2024-01-01T00:00:00Z','speed':400},{'time_tag':'2024-01-01T00:00:00Z','speed':600}])
           def test_no_duplicate_weight(self):
            rows=[{'time_tag':'2024-01-01T00:00:00Z','speed':400}]*24;self.assertIsNone(daily_means(rows)['2024-01-01']['speed'])
           def test_core_fill_count(self):
            lat=np.zeros((20,60));cmd=np.tile(np.arange(-30,30),(20,1));mask=np.abs(cmd)<5
            labels,w=core_measurements(mask,np.ones_like(mask),cmd,lat);self.assertEqual(w['M']['ch'],180);self.assertAlmostEqual(w['M']['A'],9/21)
           def test_polarity_positive_negative(self):
            mask=np.ones((32,32),bool);labels=np.full(mask.shape,2);foot=np.ones(mask.shape);mu=np.ones(mask.shape)*.8
            for sign in [-1,1]:
             s=polarity_statistics(mask,labels,np.ones(mask.shape)*sign*8,mu,foot)['M'];self.assertEqual(s['polarity'],sign);self.assertAlmostEqual(s['meanBr'],sign*10)
           def test_mixed_remains_unknown(self):
            m=np.ones((32,32),bool);b=np.ones(m.shape)*8;b[:,16:]=-8
            self.assertIsNone(polarity_statistics(m,np.full(m.shape,2),b,np.ones(m.shape),np.ones(m.shape))['M']['polarity'])
           def test_limb_no_sign(self):
            m=np.ones((32,32),bool);self.assertIsNone(polarity_statistics(m,np.full(m.shape,2),np.ones(m.shape)*8,np.ones(m.shape)*.2,np.ones(m.shape))['M']['polarity'])
           def test_low_coverage_no_sign(self):
            m=np.ones((32,32),bool);foot=np.ones(m.shape);foot[:10]=0
            self.assertIsNone(polarity_statistics(m,np.full(m.shape,2),np.ones(m.shape)*8,np.ones(m.shape),foot)['M']['polarity'])
           def test_segmentation_detects_dark_region(self):
            n=256;y,x=np.indices((n,n));rho=np.hypot(x-127.5,y-127.5)/110;valid=rho<.97
            image=np.full((n,n),100.);image[(x>135)&(x<156)&(y>80)&(y<125)]=20.
            mask,diag=segment({w:image for w in [171,193,211]},valid,rho)
            self.assertGreater(mask.sum(),500);self.assertFalse(np.any(mask&~valid));self.assertEqual(diag['method'],RECIPE)
           def test_missing_passband_rejected(self):
            a=np.ones((128,128));
            with self.assertRaises(ValueError):segment({193:a},a>0,a)
           def test_bad_euv_rejected(self):
            a=np.full((128,128),np.nan);y,x=np.indices(a.shape);r=np.hypot(x-64,y-64)/56
            with self.assertRaises(ValueError):segment({w:a for w in [171,193,211]},r<.97,r)
           def test_validation_does_not_search_peak(self):
            t=datetime(2024,6,1,tzinfo=UTC);valid=t+timedelta(days=4)
            s={'observationTime':iso(t),'recipe':RECIPE,'inputProvenance':{'hmi':{'series':'hmi.M_720s'}},'cores':{'M':{'validStart':iso(valid),'validEnd':iso(valid+timedelta(days=1)),'speed':500,'polarity':1}}}
            rows=[{'time_tag':iso(d+timedelta(hours=h)),'speed':v} for d,v in [(valid,450),(valid-timedelta(days=27),460),(valid+timedelta(days=1),500)] for h in range(24)]
            r=verify([s],rows,valid+timedelta(days=3));self.assertEqual(r['pairedTargets'],1);self.assertEqual(r['metrics'][RECIPE]['allPaired']['mae'],50);self.assertEqual(r['metrics'][RECIPE]['allPaired']['recurrenceMAE'],10);self.assertFalse(r['operationallyValidated'])
           def test_missing_baseline_not_zero_error(self):
            t=datetime(2024,6,1,tzinfo=UTC);s={'observationTime':iso(t),'recipe':RECIPE,'inputProvenance':{},'cores':{'M':{'validStart':iso(t),'validEnd':iso(t+timedelta(days=1)),'speed':500,'polarity':None}}}
            rows=[{'time_tag':iso(t+timedelta(hours=h)),'speed':500} for h in range(24)];r=verify([s],rows);self.assertEqual(r['pairedTargets'],0);self.assertEqual(r['skipped']['missingRecurrence'],1)
           def test_no_signal_not_scored_as_quiet(self):
            s={'observationTime':'2024-01-01T12:00:00Z','recipe':RECIPE,'inputProvenance':{},'cores':{'M':{'speed':None}}};r=verify([s],[]);self.assertEqual(r['skipped']['noSignal'],1);self.assertEqual(r['pairedTargets'],0)
          
          class AcquisitionSelectionTests(unittest.TestCase):
           def test_live_discovers_latest_and_history_remains_fixed(self):
            from chhss.solar import acquire
            when=datetime(2024,1,1,12,tzinfo=UTC)
            for historical in [False,True]:
             calls=[]
             class Fake:
              def __init__(self,*a,**kw):pass
              def map(self,series,target,**kwargs):
               calls.append((series,target,kwargs))
               return object(),{'observationTime':iso(when),'series':series}
             with patch('chhss.solar.JSOC',Fake),patch('chhss.solar.build_pack',return_value={'testOnly':True}):
              self.assertEqual(acquire(Path('/tmp/test-not-used'),when,historical=historical),{'testOnly':True})
             first=calls[0]
             if historical:
              self.assertEqual(first[1],when);self.assertEqual(first[2]['span_minutes'],20);self.assertFalse(first[2].get('prefer_latest',False))
             else:
              self.assertEqual(first[1],when-timedelta(minutes=150));self.assertEqual(first[2]['span_minutes'],360);self.assertTrue(first[2]['prefer_latest'])
             self.assertEqual(calls[1][1],when);self.assertEqual(calls[2][1],when)
          
          class ResumeTests(unittest.TestCase):
           def test_plan_and_resume(self):
            a=datetime(2024,1,1,tzinfo=UTC);slots=list(plan_slots(a,a+timedelta(days=4)));self.assertEqual(len(slots),4);self.assertEqual(slots[0].hour,12)
            ledger={iso(slots[0]):{'state':'complete','recipe':RECIPE},iso(slots[1]):{'state':'failed','recipe':RECIPE,'lastAttempt':iso(a)}}
            todo=select_pending(ledger,slots,2,a+timedelta(days=10));self.assertEqual(todo,[slots[1],slots[2]])
           def test_changed_recipe_reprocesses(self):
            t=datetime(2024,1,1,12,tzinfo=UTC);l={iso(t):{'state':'complete','recipe':'old'}};self.assertEqual(select_pending(l,[t],1,t),[t])
           def test_failure_retains_previous_observation(self):
            with tempfile.TemporaryDirectory() as d:
             out=Path(d)/'feed';out.mkdir();previous={'observationTime':'2024-01-01T12:00:00Z'};write_json(out/'current.json',previous)
             args=SimpleNamespace(output=str(out),cache=str(Path(d)/'cache'),start='2024-01-01',end='2024-01-04',skip_current=False,chunk=3,size=128,budget_minutes=2,retry_failed=False,embed_html=None)
             def fail(*a,**kw):raise RuntimeError('TEST simulated source outage')
             with patch('chhss.omni.fetch',return_value=([],[])):code=run(args,fail)
             feed=read_json(out/'feed.json');self.assertEqual(code,2);self.assertEqual(feed['current']['observationTime'],previous['observationTime']);self.assertEqual(feed['status']['backfill']['completedDays'],0);self.assertEqual(feed['status']['backfill']['failedDays'],2);self.assertEqual(feed['status']['backfill']['notAttemptedDays'],1);self.assertEqual(feed['verification']['pairedTargets'],0)
           def test_embedded_data_cannot_close_script(self):
            with tempfile.TemporaryDirectory() as d:
             p=Path(d)/'in.html';p.write_text('<head><!-- CHHSS_BOOTSTRAP_SLOT --></head>');out=Path(d)/'out.html';embed(p,{'x':'</script><script>alert(1)</script>'},out);s=out.read_text();self.assertNotIn('<script>alert',s)
          
