name: Coronal Hole / HSS Outlook data

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Backfill start YYYY-MM-DD (blank resumes stored plan)"
        required: false
        default: ""
      end:
        description: "Exclusive end YYYY-MM-DD (blank resumes stored plan)"
        required: false
        default: ""
      chunk:
        description: "Maximum historical days this run (default 7)"
        required: false
        default: "7"
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: write

concurrency:
  group: chhss-feed-publication
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Materialize bundled producer (readable source below)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .chhss-runtime/chhss .chhss-runtime/tests
          cat > .chhss-runtime/requirements-chhss.txt <<'CHHSS_SOURCE_EOF'
          # Compatible API ranges, not a claim that every combination was tested here.
          # The workflow saves its resolved environment in its diagnostic artifact.
          numpy>=1.26,<3
          scipy>=1.13,<2
          Pillow>=10,<13
          requests>=2.31,<3
          astropy>=6.1,<9
          sunpy[map]>=6,<9
          reproject>=0.14,<1
          drms>=0.8,<1
          CHHSS_SOURCE_EOF
          cat > .chhss-runtime/chhss/core.py <<'CHHSS_SOURCE_EOF'
          """Pure, versioned CH/HSS measurement, calendar-target and verification logic.
          No credentials, live defaults, sample observations or fitted coefficients here.
          """
          from __future__ import annotations
          import hashlib, json, math
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import numpy as np
          from scipy import ndimage
          
          UTC=timezone.utc
          RECIPE='chhss-aia-dark-regions-1.0.0'
          CORES={'E':(-40.,-20.,6),'M':(-10.,10.,4),'W':(20.,40.,2)}
          SEGMENTATION={'primary193Threshold':.55,'secondary211Threshold':.60,
           'max171Ratio':1.10,'scienceRadius':.97,'minDiskFraction':.0005,
           'gaussianSigmaAt512':1.0,'closeRadiusAt512':1,
           'magneticMinAbsImbalance':.15,'magneticMinMeanBrG':1.,
           'minPolarityPixels':100,'minPolarityCoverage':.8,'muMin':.4}
          
          def stamp(x):
              if isinstance(x,datetime):return x.astimezone(UTC)
              s=str(x).replace('Z','+00:00'); t=datetime.fromisoformat(s)
              if t.tzinfo is None:raise ValueError('UTC offset is required: '+s)
              return t.astimezone(UTC)
          def iso(x=None):return (x or datetime.now(UTC)).astimezone(UTC).isoformat(timespec='seconds').replace('+00:00','Z')
          def write_json(path,obj):
              path=Path(path);path.parent.mkdir(parents=True,exist_ok=True)
              body=json.dumps(obj,ensure_ascii=False,allow_nan=False,separators=(',',':'))+'\n'
              tmp=path.with_name(path.name+'.tmp');tmp.write_text(body,encoding='utf-8');tmp.replace(path)
          def read_json(path,default=None):
              try:return json.loads(Path(path).read_text(encoding='utf-8'))
              except FileNotFoundError:return default
          
          def normalized_channel(data,valid,rho,size):
              """Exposure-normalized FITS intensity / robust annular median.
              Removes broad center-to-limb brightness, not an AIA response calibration.
              A missing/bad channel is an ingest failure, not an empty coronal-hole mask.
              """
              a=np.asarray(data,float); good=valid&np.isfinite(a)&(a>0)
              if good.sum()<.9*max(1,valid.sum()):raise ValueError('Less than 90% positive valid EUV pixels')
              profile=[];radii=[]
              for lo,hi in zip(np.linspace(0,.98,25)[:-1],np.linspace(0,.98,25)[1:]):
                  v=a[good&(rho>=lo)&(rho<hi)]
                  if len(v)>=32:profile.append(float(np.median(v)));radii.append((lo+hi)/2)
              if len(profile)<12:raise ValueError('Insufficient annular EUV coverage')
              # Median within each annulus resists small ARs and small dark features;
              # widespread dark/bright structures can bias it. Retain this limitation.
              base=np.interp(rho,np.asarray(radii),np.asarray(profile))
              n=np.where(good,a/np.maximum(base,1e-12),1.0)
              sigma=SEGMENTATION['gaussianSigmaAt512']*size/512
              return ndimage.gaussian_filter(n,sigma=sigma),{'radii':radii,'medianIntensity':profile}
          
          def segment(images,valid,rho):
              """Deterministic three-passband candidate mask; not branded as CHIMERA.
              HMI is used separately to qualify sign, not to invent missing EUV geometry.
              Thresholds are fixed for all backfill and live runs of this recipe.
              """
              if set(images)!={171,193,211}:raise ValueError('All AIA 171/193/211 channels required')
              size=valid.shape[0];norm={};profiles={}
              for wave in [171,193,211]:norm[wave],profiles[str(wave)]=normalized_channel(images[wave],valid,rho,size)
              raw=valid&(norm[193]<.55)&(norm[211]<.60)&(norm[171]<1.10)
              radius=max(1,round(size/512));yy,xx=np.ogrid[-radius:radius+1,-radius:radius+1];structure=xx*xx+yy*yy<=radius*radius
              mask=ndimage.binary_closing(raw,structure=structure)&valid
              labels,n=ndimage.label(mask);counts=np.bincount(labels.ravel());minimum=max(16,round(valid.sum()*.0005))
              keep=counts>=minimum;keep[0]=False;mask=keep[labels]&valid
              if mask.sum()/max(1,valid.sum())>.45:raise ValueError('Candidate coverage >45% of disk: segmentation QA rejection')
              return mask,{'method':RECIPE,'parameters':dict(SEGMENTATION),'normalization':profiles,
                'candidatePixels':int(mask.sum()),'validPixels':int(valid.sum()),'minComponentPixels':minimum,
                'limitations':'Custom automatic EUV candidate detector. Filament rejection and forecast transfer remain to be validated; not CHIMERA or a reviewed reference mask.'}
          
          def daily_means(rows,min_hours=20):
              """One observation per UTC hour; duplicate/conflicting hours are rejected."""
              hours={}; out={}
              for r in rows:
                  t=stamp(r['time_tag']); key=iso(t.replace(minute=0,second=0,microsecond=0))
                  v=r.get('speed');v=float(v) if v is not None else None
                  if v is not None and (not math.isfinite(v) or not 0<v<5000):v=None
                  if key in hours and hours[key]!=v:raise ValueError('Conflicting duplicate truth hour '+key)
                  hours[key]=v
              for key,v in hours.items():out.setdefault(key[:10],[]).append(v)
              return {d:{'speed':float(np.mean([v for v in a if v is not None])) if sum(v is not None for v in a)>=min_hours else None,
                'validHours':sum(v is not None for v in a),'expectedHours':24} for d,a in out.items()}
          
          def summarize_pack(p,requested_time):
              """Compact historical issuance input; no later outcomes used for selection."""
              obs=stamp(p['observationTime']);pol=(p.get('polarity') or {}).get('sector',{})
              out={'observationTime':iso(obs),'requestedTime':iso(requested_time),'retrievedAt':p['availableAt'],
                'recipe':p['measurementEngine'],'maskId':p['maskId'],'inputProvenance':p['source'],
                'sampleType':'retrospective-reconstruction','sourceFamily':'untracked','cores':{}}
              for k,(_,_,lag) in CORES.items():
                  w=p['measured']['window'][k];f=float(w['A']);start=(obs+timedelta(days=lag)).replace(hour=0,minute=0,second=0,microsecond=0)
                  out['cores'][k]={'fraction':f,'candidatePixels':int(w['ch']),'diskPixels':int(w['disk']),
                    'polarity':pol.get(k,{}).get('polarity'),'polarityQA':pol.get(k,{}),
                    'validStart':iso(start),'validEnd':iso(start+timedelta(days=1)),
                    'speed':350+900*f if f>=.02 else None,'signal':f>=.02,
                    'target':'daily_mean_speed','lagDays':lag}
              return out
          
          def stats(pairs):
              if not pairs:return {'n':0,'mae':None,'rmse':None,'bias':None,'recurrenceMAE':None,'skillVsRecurrence':None}
              err=np.array([p['forecast']-p['observed'] for p in pairs]);re=np.array([p['recurrence']-p['observed'] for p in pairs])
              mae=float(np.abs(err).mean());base=float(np.abs(re).mean())
              return {'n':len(pairs),'mae':mae,'rmse':float(np.sqrt((err**2).mean())), 'bias':float(err.mean()),
                'recurrenceMAE':base,'skillVsRecurrence':1-mae/base if base>0 else None}
          
          def verify(samples,truth,now=None):
              now=now or datetime.now(UTC);means=daily_means(truth);pairs=[];skipped={'noSignal':0,'pendingTarget':0,'missingTarget':0,'missingRecurrence':0}
              for s in samples:
                  for k,c in s['cores'].items():
                      if c['speed'] is None:skipped['noSignal']+=1;continue
                      start=stamp(c['validStart']);end=stamp(c['validEnd'])
                      if end>now:skipped['pendingTarget']+=1;continue
                      obs=means.get(start.date().isoformat(),{}).get('speed')
                      ref=means.get((start-timedelta(days=27)).date().isoformat(),{}).get('speed')
                      if obs is None:skipped['missingTarget']+=1;continue
                      if ref is None:skipped['missingRecurrence']+=1;continue
                      pairs.append({'issue':s['observationTime'],'core':k,'validStart':iso(start),'forecast':c['speed'],
                        'observed':obs,'recurrence':ref,'recipe':s['recipe'],'hmiSeries':(s['inputProvenance'].get('hmi') or {}).get('series'),
                        'polarity':c['polarity'],'regime':'all solar-wind regimes; ICME screening not supplied'})
              recipes=sorted({s['recipe'] for s in samples});matched=sorted(pairs,key=lambda p:p['issue']);by_recipe={}
              for recipe in recipes:
                  pool=[p for p in matched if p['recipe']==recipe]
                  # Fixed empirical coefficients: these are evaluation partitions, not a
                  # secretly fitted training set. No coefficients are auto-promoted.
                  days=sorted({p['issue'][:10] for p in pool});cut=days[int(len(days)*.7)] if len(days)>=3 else None
                  test=[p for p in pool if cut and stamp(p['issue'])>=stamp(cut+'T00:00:00Z')+timedelta(days=34)]
                  dev=[p for p in pool if cut and p['issue'][:10]<cut]
                  blocks={}
                  for p in test:
                      bid=int(stamp(p['issue']).timestamp()//(54*86400));blocks.setdefault(bid,[]).append(p)
                  ci=None
                  if len(blocks)>=6:
                      rng=np.random.default_rng(12345);keys=list(blocks);skills=[]
                      for _ in range(1000):
                          b=[q for j in rng.integers(0,len(keys),len(keys)) for q in blocks[keys[j]]];v=stats(b)['skillVsRecurrence']
                          if v is not None:skills.append(v)
                      if skills:ci=[float(x) for x in np.quantile(skills,[.025,.975])]
                  by_recipe[recipe]={'allPaired':stats(pool),'development':stats(dev),'heldOut':stats(test),'splitDate':cut,
                    'embargoDays':34,'heldOut54DayBlocks':len(blocks),'skill95BlockInterval':ci,
                    'byCore':{k:stats([p for p in pool if p['core']==k]) for k in CORES},
                    'byHmiSeries':{series:stats([p for p in pool if str(p['hmiSeries'])==series]) for series in sorted({str(p['hmiSeries']) for p in pool})}}
              return {'schemaVersion':'chhss-validation-2','generatedAt':iso(now),'sampleCount':len(samples),'pairedTargets':len(pairs),
                'status':'RETROSPECTIVE EVALUATION' if pairs else 'AWAITING PAIRED OBSERVATIONS','operationallyValidated':False,
                'metrics':by_recipe,'skipped':skipped,'pairs':pairs,'provenance':{'truth':'NASA OMNI2 hourly, retrospective',
                  'target':'daily_mean_speed; same 24h UTC window for forecast and 27-day recurrence',
                  'minValidHours':20,'recipeVersions':recipes,'parametersTuned':False,'sourceFamilyTracking':False,
                  'icmeScreening':False,'sampleSelection':'Every requested daily slot is logged, including failures and no-signal slots.',
                  'limitation':'Custom detector and empirical speed transfer require qualification. Recurrent source families are not tracked; time-block intervals are not family-purged. All-regime scores are not clean-HSS scores. Definitive/NRT transfer is unvalidated. No-signal cases are not scored as correct quiet forecasts.'}}
          CHHSS_SOURCE_EOF
          cat > .chhss-runtime/chhss/omni.py <<'CHHSS_SOURCE_EOF'
          """Documented OMNI2 column mapping, bounded downloads and gap-preserving cache."""
          from __future__ import annotations
          import calendar,hashlib
          from datetime import datetime,timedelta
          from pathlib import Path
          import requests
          from .core import UTC,iso,read_json,write_json
          FIELDS={'bt':(9,999.9),'bz_gsm':(17,999.9),'temperature':(23,9999999.),'density':(24,999.9),
                  'speed':(25,9999.),'kp':(39,99),'dst':(41,99999),'ap':(50,999)}
          BASES=['https://spdf.gsfc.nasa.gov/pub/data/omni/low_res_omni/','https://cdaweb.gsfc.nasa.gov/pub/data/omni/low_res_omni/']
          def parse_line(line):
              p=line.split()
              if not p:return None
              if len(p)<50:raise ValueError('OMNI row missing documented fields')
              year,doy,hour=map(int,p[:3]);days=366 if calendar.isleap(year) else 365
              if not 1963<=year<=2100 or not 1<=doy<=days or not 0<=hour<=23:raise ValueError('Invalid OMNI timestamp')
              row={'time_tag':iso(datetime(year,1,1,tzinfo=UTC)+timedelta(days=doy-1,hours=hour))}
              for name,(col,fill) in FIELDS.items():
                  v=float(p[col-1]);row[name]=None if v==fill else v/10 if name=='kp' else v
              if row['speed'] is not None and not 0<row['speed']<5000:raise ValueError('OMNI speed schema/quality error')
              return row
          
          def fetch(cache:Path,start,end,offline=False):
              cache=Path(cache);cache.mkdir(parents=True,exist_ok=True);rows={};provenance=[]
              now=datetime.now(UTC)
              for year in range(start.year,(end-timedelta(microseconds=1)).year+1):
                  path=cache/f'omni2_{year}.dat';meta=read_json(path.with_suffix('.json'),{})
                  refresh=not path.exists() or (now.timestamp()-path.stat().st_mtime>86400 and year>=now.year-1)
                  error=None
                  if refresh and not offline:
                      for base in BASES:
                          try:
                              url=base+path.name;r=requests.get(url,timeout=(15,90));r.raise_for_status()
                              body=r.text
                              for line in body.splitlines():
                                  if line.strip():parse_line(line);break
                              tmp=path.with_suffix('.tmp');tmp.write_text(body);tmp.replace(path)
                              meta={'url':url,'retrievedAt':iso(now),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
                              write_json(path.with_suffix('.json'),meta);error=None;break
                          except Exception as e:error=str(e)
                  if not path.exists():raise RuntimeError(f'OMNI {year} is unavailable: {error or "cache missing"}')
                  source={**meta,'year':year,'usingCachedAfterFailure':bool(error)};provenance.append(source)
                  for line in path.read_text().splitlines():
                      row=parse_line(line)
                      if row and iso(start)<=row['time_tag']<iso(end):
                          if row['time_tag'] in rows and rows[row['time_tag']]!=row:raise ValueError('Conflicting OMNI duplicate')
                          rows[row['time_tag']]=row
              return sorted(rows.values(),key=lambda r:r['time_tag']),provenance
          CHHSS_SOURCE_EOF
          cat > .chhss-runtime/chhss/solar.py <<'CHHSS_SOURCE_EOF'
          """Automatic JSOC FITS acquisition and co-registered AIA/HMI measurements.
          Online segment access needs no export account; tape staging requires JSOC_EMAIL.
          No PNG/JPEG is interpreted as a signed magnetogram. Direct segment data are
          paired with keyword metadata from the EXACT SAME DRMS record.
          """
          from __future__ import annotations
          import base64, hashlib, io, json, os, re, socket, time
          from datetime import datetime,timedelta
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          import numpy as np
          import requests
          from .core import UTC,RECIPE,CORES,segment,stamp,iso,read_json,write_json
          from .measurement_math import core_measurements,polarity_statistics
          
          class AcquisitionError(RuntimeError):pass
          
          class JSOC:
              def __init__(self,cache:Path,email=None):
                  import drms
                  socket.setdefaulttimeout(45)
                  self.cache=Path(cache);self.cache.mkdir(parents=True,exist_ok=True);self.email=email
                  self.host='https://jsoc.stanford.edu'
                  server=drms.ServerConfig(name='chhss-jsoc-https',cgi_baseurl=self.host+'/cgi-bin/ajax/',
                    cgi_jsoc_info='jsoc_info',cgi_jsoc_fetch='jsoc_fetch',cgi_check_address='checkAddress.sh',
                    cgi_show_series='show_series',http_download_baseurl=self.host+'/',encoding='utf8')
                  self.client=drms.Client(server=server,email=email);self.session=requests.Session();self.keys={}
          
              @staticmethod
              def parse_time(v):
                  from astropy.time import Time
                  s=str(v).strip()
                  # DRMS time is frequently TAI; naive drms.to_datetime does not convert it.
                  scale='tai' if s.upper().endswith('_TAI') else 'utc'
                  s=re.sub(r'_(TAI|UTC)$','',s,flags=re.I)
                  s=re.sub(r'^(\d{4})\.(\d\d)\.(\d\d)',r'\1-\2-\3',s).replace('_','T').rstrip('Z')
                  return Time(s,scale=scale).utc.to_datetime(timezone=UTC)
          
              def query(self,series,when,wave=None,span_minutes=20,cadence='1m',prefer_latest=False):
                  from astropy.time import Time
                  start=Time(when-timedelta(minutes=span_minutes/2)).tai.to_datetime().strftime('%Y.%m.%d_%H:%M:%S_TAI')
                  ds=f'{series}[{start}/{span_minutes}m@{cadence}]'+(f'[{wave}]' if wave else '')
                  seg='image' if wave else 'magnetogram'
                  if series not in self.keys:self.keys[series]=self.client.keys(series)
                  error=None
                  for attempt in range(3):
                      try:
                          keys,segs=self.client.query(ds,key=self.keys[series],seg=seg,rec_index=True)
                          if keys is None or segs is None or keys.empty:raise AcquisitionError('No records for '+ds)
                          candidates=[]
                          for record,row in keys.iterrows():
                              lower={str(k).lower():v for k,v in row.to_dict().items()}
                              try:
                                  if int(lower.get('quality',-1))!=0:continue
                                  observed=self.parse_time(lower.get('t_obs') or lower.get('date-obs') or lower.get('date_obs') or lower['t_rec'])
                                  delta=abs((observed-when).total_seconds())
                                  if delta>span_minutes*30+90:continue
                                  path=segs.loc[record,seg]
                                  candidates.append((delta,str(record),lower,path,observed))
                              except (ValueError,TypeError,KeyError):continue
                          if not candidates:raise AcquisitionError('No QUALITY=0 co-timed record for '+ds)
                          return min(candidates,key=(lambda r:(-r[4].timestamp(),r[1])) if prefer_latest else (lambda r:(r[0],r[1])))
                      except Exception as e:
                          error=e
                          if attempt<2:time.sleep(2*(attempt+1))
                  raise AcquisitionError('JSOC metadata query failed: '+str(error)) from error
          
              def download(self,url,path):
                  if not url.startswith('https://'):raise AcquisitionError('Only HTTPS data downloads are permitted')
                  for attempt in range(3):
                      try:
                          with self.session.get(url,timeout=(15,90),stream=True) as r:
                              r.raise_for_status();size=0;tmp=path.with_suffix('.partial')
                              with tmp.open('wb') as f:
                                  for chunk in r.iter_content(1024*1024):
                                      size+=len(chunk)
                                      if size>250*1024*1024:raise AcquisitionError('FITS download exceeds 250 MB cap')
                                      f.write(chunk)
                              with tmp.open('rb') as f:magic=f.read(8)
                              if magic not in [b'SIMPLE  ',b'XTENSION']:raise AcquisitionError('Response is not FITS; reject HTML/error body')
                              tmp.replace(path);return
                      except Exception:
                          path.with_suffix('.partial').unlink(missing_ok=True)
                          if attempt==2:raise
                          time.sleep(2*(attempt+1))
          
              def map(self,series,when,wave=None,span_minutes=20,cadence='1m',prefer_latest=False):
                  from astropy.io import fits
                  import sunpy.map
                  _,record,meta,segment,observed=self.query(series,when,wave,span_minutes,cadence,prefer_latest)
                  key=hashlib.sha256(record.encode()).hexdigest();path=self.cache/(key+'.fits');mfile=self.cache/(key+'.json')
                  prior=read_json(mfile,{})
                  metadata_sha=hashlib.sha256(json.dumps(meta,sort_keys=True,default=str).encode()).hexdigest()
                  if prior and prior.get('keywordSHA256')!=metadata_sha:path.unlink(missing_ok=True)
                  if prior and prior.get('record')!=record:raise AcquisitionError('Cache record identity mismatch')
                  url=urljoin(self.host,str(segment)) if str(segment).startswith('/') else str(segment)
                  if not path.exists():
                      try:
                          if not url.startswith(self.host+'/SUM'):raise AcquisitionError('Segment not currently online')
                          self.download(url,path)
                      except Exception as first:
                          if not self.email:raise AcquisitionError('Record not directly downloadable. Set a registered JSOC_EMAIL for archive staging. '+record) from first
                          # Reuse an earlier staging request after a timeout; do not flood JSOC.
                          ticket=read_json(self.cache/(key+'.export.json'),{})
                          if ticket.get('id'):
                              req=self.client.export_from_id(ticket['id'])
                          else:
                              req=self.client.export(record+'{'+('image' if wave else 'magnetogram')+'}',method='url',protocol='fits')
                              if req.id:write_json(self.cache/(key+'.export.json'),{'id':req.id,'record':record,'submittedAt':iso()})
                          if not req.wait(timeout=240,sleep=10):raise AcquisitionError('JSOC archive staging pending; next run resumes '+str(req.id))
                          if not req.has_succeeded():raise AcquisitionError('JSOC archive staging failed '+str(req.id))
                          urls=req.urls
                          matches=urls[urls['record'].astype(str).str.split('{').str[0]==record.split('{')[0]]
                          if len(matches)!=1:raise AcquisitionError('Export did not return exactly the requested record')
                          url=str(matches.iloc[0]['url']).replace('http://','https://',1);self.download(url,path)
                  with fits.open(path,memmap=False) as hdus:
                      hdu=next((h for h in hdus if h.data is not None and np.ndim(h.data)==2),None)
                      if hdu is None:raise AcquisitionError('FITS has no 2-D science image')
                      data=np.array(hdu.data,dtype=np.float32)
                  # getdata applies FITS BSCALE/BZERO. Do NOT apply those again via metadata.
                  header={}
                  for k,v in meta.items():
                      if hasattr(v,'item'):v=v.item()
                      if v is None or isinstance(v,float) and not np.isfinite(v):continue
                      if k.upper() in ['BITPIX','SIMPLE','NAXIS','NAXIS1','NAXIS2','BZERO','BSCALE','BLANK']:continue
                      header[k]=v
                  header['date-obs']=iso(observed);header['timesys']='UTC'
                  # JSOC may express the observer in Carrington rather than Stonyhurst.
                  required=['ctype1','ctype2','crpix1','crpix2','cdelt1','cdelt2','cunit1','cunit2','dsun_obs','rsun_obs']
                  if any(k not in header for k in required):raise AcquisitionError('Missing essential WCS/observer keywords')
                  if not (all(k in header for k in ['hgln_obs','hglt_obs']) or all(k in header for k in ['crln_obs','crlt_obs'])):
                      raise AcquisitionError('No actual observer longitude/latitude in metadata')
                  m=sunpy.map.Map(data,header)
                  with path.open('rb') as f:digest=hashlib.file_digest(f,'sha256').hexdigest()
                  info={'series':series,'record':record,'segment':('image' if wave else 'magnetogram'),
                    'observationTime':iso(observed),'url':url,'sha256':digest,'metadataSource':'same-record DRMS keywords',
                    'quality':int(header['quality']),'keywordSHA256':metadata_sha,'retrievedAt':(prior.get('retrievedAt') or iso()) if prior.get('keywordSHA256')==metadata_sha else iso()}
                  write_json(mfile,info)
                  return m,info
          
          def build_pack(maps,provenance,size=512,historical=False):
              """Convert actual acquired science maps into a browser-verified package."""
              import astropy.units as u
              from astropy.coordinates import SkyCoord
              import sunpy.map
              from sunpy.coordinates import frames,transform_with_sun_center
              from PIL import Image
              from scipy import ndimage
              euv=maps[193];t=euv.date.utc.to_datetime(timezone=UTC)
