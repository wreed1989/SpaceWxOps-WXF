          """Pure array statistics for an explicitly registered, curated coronal-hole mask.
          QA thresholds are provisional engineering defaults, not validation results.
          """
          from __future__ import annotations
          import numpy as np
          CORES={'E':(-40.,-20.),'M':(-10.,10.),'W':(20.,40.)}
          
          def core_measurements(mask,valid,cmd,lat):
              labels=np.zeros(mask.shape,dtype=np.uint8); windows={}
              for i,(key,(lo,hi)) in enumerate(CORES.items(),1):
                  eligible=valid & np.isfinite(cmd) & np.isfinite(lat) & (cmd>=lo)&(cmd<=hi)
                  labels[eligible]=i; selected=eligible & mask
                  n=int(eligible.sum());ch=int(selected.sum())
                  windows[key]={'A':ch/n if n else 0.,'disk':n,'ch':ch,'centroidLat':float(np.mean(lat[selected])) if ch else None,'centroidCmd':float(np.mean(cmd[selected])) if ch else None}
              return labels,windows
          
          def polarity_statistics(mask,core_labels,blos,mu,footprint,*,mu_min=.4,min_imbalance=.15,min_valid=100,min_coverage=.8,min_mean_br=1.):
              sectors={}
              for i,key in enumerate(CORES,1):
                  region=mask & (core_labels==i);total=int(region.sum())
                  ok=region & np.isfinite(blos)&np.isfinite(mu)&(mu>=mu_min)&(footprint>=.99)
                  n=int(ok.sum());cov=n/total if total else 0.
                  if n:
                      br=blos[ok]/mu[ok] # radial-field approximation, not a measured vector field
                      area_weight=1/mu[ok] # relative surface-area weighting
                      signed=float(np.sum(br*area_weight));unsigned=float(np.sum(np.abs(br)*area_weight))
                      imbalance=signed/unsigned if unsigned else 0.
                      mean_br=float(np.average(br,weights=area_weight));median_br=float(np.median(br))
                  else:imbalance=0.;mean_br=median_br=None
                  qualified=n>=min_valid and cov>=min_coverage and abs(imbalance)>=min_imbalance and mean_br is not None and abs(mean_br)>=min_mean_br
                  sectors[key]={'coreDefinition':'20deg-hgs','polarity':int(np.sign(imbalance)) if qualified else None,'fluxImbalance':float(imbalance),'meanBr':mean_br,'medianBr':median_br,'validMaskedPixelFraction':cov,'nValid':n,'nMasked':total,'quality':'research-QA' if qualified else 'mixed/weak/insufficient','thresholds':{'minMeanBrG':min_mean_br,'minPixels':min_valid,'minImbalance':min_imbalance,'minCoverage':min_coverage}}
              return sectors
